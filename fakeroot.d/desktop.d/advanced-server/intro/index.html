<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Server — Introduction</title>
  <link rel="stylesheet" href="../../../sub-site.css">
  <style>
    #readme pre {
      background: var(--code-bg);
      border: 1px solid var(--bg3);
      padding: 10px 14px;
      overflow-x: auto;
      margin: 8px 0 10px;
      border-radius: 2px;
    }
    #readme pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.85em;
      color: var(--text);
      font-family: 'Consolas', 'Courier New', monospace;
    }
    #readme blockquote {
      border-left: 3px solid var(--acc2);
      padding: 4px 12px;
      color: var(--text-dim);
      margin: 8px 0;
    }
    #readme hr {
      border: none;
      border-top: 1px solid var(--bg3);
      margin: 14px 0;
    }
    #readme img { max-width: 100%; height: auto; }
    #readme table {
      border-collapse: collapse;
      width: 100%;
      margin: 8px 0;
      font-size: 0.9em;
    }
    #readme th, #readme td {
      border: 1px solid var(--bg3);
      padding: 5px 10px;
      text-align: left;
    }
    #readme th { background: var(--bg2); color: var(--acc); }
    .rm-status { font-style: italic; color: var(--text-dim); padding: 12px 0; }
    .rm-error   { color: #e08080; padding: 12px 0; }
    .branch-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .branch-btn {
      background: var(--bg3);
      border: 2px solid;
      border-color: var(--hi) var(--lo) var(--lo) var(--hi);
      color: var(--link);
      padding: 4px 14px;
      font-size: 0.9em;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.1s;
    }
    .branch-btn:hover { background: var(--acc2); color: #fff; }
    .branch-btn.active {
      background: var(--acc2);
      color: #fff;
      border-color: var(--lo) var(--hi) var(--hi) var(--lo);
    }
  </style>
</head>
<body>

<h1>Advanced Server — Introduction</h1>

<div class="branch-toggle" role="group" aria-label="README branch">
  <button type="button" class="branch-btn active" data-branch="stable">Stable</button>
  <button type="button" class="branch-btn" data-branch="testing">Testing</button>
</div>

<div id="readme">
  <p class="rm-status">Loading…</p>
</div>

<script src="../../../vendor/marked.min.js"></script>
<script>
(function () {
    const BRANCHES = {
        stable:  'https://raw.githubusercontent.com/thearcticfox25/AdvancedServer/stable/README.MD',
        testing: 'https://raw.githubusercontent.com/thearcticfox25/AdvancedServer/testing/README.MD'
    };
    const el      = document.getElementById('readme');
    const buttons = document.querySelectorAll('.branch-btn');

    function render(md) {
        if (typeof marked !== 'undefined') {
            el.innerHTML = marked.parse(md);
        } else {
            el.innerHTML = '<pre style="white-space:pre-wrap;overflow-x:auto">'
                + md.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>';
        }
    }

    function load(branch) {
        el.innerHTML = '<p class="rm-status">Loading…</p>';
        fetch(BRANCHES[branch])
            .then(r => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.text();
            })
            .then(render)
            .catch(err => {
                el.innerHTML =
                    '<p class="rm-error">&#9888; Could not load README (' + err.message + '). ' +
                    '<a href="https://github.com/thearcticfox25/AdvancedServer/blob/' + branch + '/README.MD" target="_blank">' +
                    'View on GitHub</a></p>';
            });
    }

    buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            load(btn.dataset.branch);
        });
    });

    load('stable');
})();
</script>

</body>
</html>
